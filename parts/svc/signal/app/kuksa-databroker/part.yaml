# Identity (class/subtype/layer/name) comes from this file's own path — never restated here.
#
# Simple relabel pattern (like hpc/ad/middleware/ros2-humble): Eclipse Kuksa publishes real,
# versioned, multi-arch OCI images — unlike the two gw/5gc, gw/ran siblings landed alongside
# this part, no build:recipe non-OCI-upstream workaround is needed here.
license: Apache-2.0
upstream:
  ref: ghcr.io/eclipse-kuksa/kuksa-databroker:0.7.1
  digest: sha256:529d8c6d3cc223362667672978bcb8f92c4d356b25aedd336e7a2e004d7279bd
  # Resolved 2026-11-03 via `oras resolve ghcr.io/eclipse-kuksa/kuksa-databroker:0.7.1`
  # (manifest-list digest: amd64, arm64, riscv64). Latest release as of pinning: 0.7.1
  # (2026-08-26), confirmed via `gh release list -R eclipse-kuksa/kuksa-databroker`.
  # Previous pin: 0.7.0, sha256:9ace2824719ba7c05929f0af4827d9b25fa5ca7b2e0d58d0acff95885c649d6d.
annotations:
  role: vss-signal-plane
  kuksa-databroker-version: "0.7.1"
  # The manifest schema hook this part feeds: SignalBinding.vss (vxedge-core::model /
  # workspace.rs) — a per-device COVESA VSS path string, parsed today, nothing plugged into
  # it yet. This part is that first plug: the databroker a rendered vss: path would subscribe
  # against.
sbom:
  format: cyclonedx-json
  path: sbom.cdx.json
  # Upstream's own CycloneDX SBOM, from its cargo build, inside the image. scripts/sbom.sh copies
  # it out of the pinned digest; a scanner finds no components in the static binary.
  from_image: /app/sbom.json
