# A UDP reflector for vxedge's qemu-microvm backend: echoes every datagram on :9800, as
# `vxprobe reflect` does, on a virtio-mmio NIC. IP and MAC arrive at run time.
CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_MULTIBOOT_INFO=y
CONFIG_X86_MEMMAP=y
CONFIG_LOG=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_VIRTIO=y
CONFIG_VIRTIO_MMIO=y
CONFIG_ETH_VIRTIO_NET=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_X86_DYNAMIC_IRQ_STUBS=8
# Zephyr's 32-bit PAE page tables set reserved bits in the PDPT entry, which KVM refuses with a
# triple fault on the CR0 write (QEMU's TCG accepts them). No MMU means no tables, and the loader's
# command line is addressable as it stands.
CONFIG_X86_MMU=n
