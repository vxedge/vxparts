# Identity (class/subtype/layer/name) comes from this file's own path — never restated here.
#
# Not built from source: SONiC-VS is produced by upstream sonic-buildimage's own multi-hour CI
# pipeline. This part re-labels an official pre-built artifact under vxedge's own registry
# namespace. Confirmed 2026-08-03: this artifact is not published to
# any OCI/ORAS-pullable registry — it is an Azure Pipelines build output, fetched over plain
# HTTPS via Azure's public build API (see build.sh) — only the *republish* half is `oras push`.
build: recipe
# The build tooling is Apache-2.0 (Microsoft). The built image bundles a Debian base, the Linux
# kernel (GPL-2.0), FRR and the SONiC containers under their own terms; ThirdPartyLicenses.txt
# lists only a few script-level imports and does not itemise them. Not cleared for public
# redistribution (README, License).
license: "Apache-2.0 AND (Debian, Linux and SONiC component terms, not yet itemised)"
annotations:
  arch: x86_64
  # Not a zone-attached guest: does not follow the zone-backend-contract guest-bundle
  # convention (no `vx.ip=` kernel cmdline, no vmlinuz/initrd split — see this part's README).
  role: production-nos-twin
upstream:
  # A specific Azure Pipelines build, not "latest on a branch" (reproducibility, Sec 13) —
  # resolved 2026-08-03 via Azure's public build API (no auth needed):
  # Azure.sonic-buildimage.official.vs (definition 142), branch 202505, buildNumber 20260803.4,
  # sonic-buildimage commit ff3c0c9f686a1d0dbddbe813b233b3b7a51bd8e2. build.sh re-resolves the
  # actual download URL from this build id at fetch time (Azure's artifact download URLs are
  # per-request tokens, not stable links to record here directly).
  ref: https://dev.azure.com/mssonic/build/_build/results?buildId=1182664
  # SHA256 of the pristine, never-booted, decompressed sonic-vs.img (not the .gz). Verified
  # locally 2026-08-03: downloaded, gzip -t clean, `file` confirms a valid QEMU QCOW2 v3 image
  # (16GiB virtual, 6.01GiB actual), and a *separate disposable copy* (never this digest's own
  # bytes — see build.sh's boot warning) booted clean under QEMU/KVM to an interactive login
  # (`admin`/`YourPaSsWoRd`) and `show version` matching this exact build. Full account in this
  # part's README.
  digest: sha256:0a95ffa745e8e9871653d8605f372a2761edcef2ec53844a37651e343be7dda5
sbom:
  format: cyclonedx-json
  path: bundle/sbom.cdx.json   # emitted by build.sh when SBOM tooling is present
