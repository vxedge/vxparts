# Identity (class/subtype/layer/name) comes from this file's own path — never restated here.
#
# Not a relabeled upstream image: Open5GS has no official OCI image this project validated
# against — it ships via the `ppa:open5gs/latest` Ubuntu PPA, not a container registry
# (confirmed 2026-08-05, same diligence sonic-vs's README applies to its own non-OCI upstream).
# `upstream.ref`/`digest` below pin this build's actual `FROM` base
# (docker.io/library/ubuntu:24.04, resolved 2026-08-05) — the thing publish-container.sh's
# `--build-arg UPSTREAM=<ref>@<digest>` mechanism actually injects. The open5gs package
# version itself is recorded in `annotations.open5gs-version`, not here: apt always installs
# "whatever's current in the PPA today," so a base-image digest is the honest reproducibility
# pin (ARCHITECTURE.md §13) — it does not by itself guarantee the open5gs package's bytes are
# identical between two builds a PPA update apart. Track that as a known limitation, not a
# silent gap: re-pin `open5gs-version` deliberately if a PPA update changes NF behavior.
build: recipe
license: AGPL-3.0
annotations:
  arch: x86_64
  role: 5g-core
  open5gs-version: "2.8.0"
  # Renderer compatibility: vxedge_core::fiveg targets Open5GS 2.8.x specifically
  # (vxedge/crates/vxedge-core/src/fiveg/mod.rs) — this pin must track that value, not
  # "whatever apt resolves," or the rendered config schema and the running NFs can drift apart.
upstream:
  ref: docker.io/library/ubuntu:24.04
  digest: sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
sbom:
  format: cyclonedx-json
  path: sbom.cdx.json
