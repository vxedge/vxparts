# CARLA's code is MIT and its assets CC BY 4.0 (0.9.15 README; the pinned content release's
# LICENSE). The engine is Unreal Engine 4 under Epic's EULA, which SPDX does not name.
license: MIT AND CC-BY-4.0
gpu: passthrough
# What this part needs to run, distinct from `gpu:` above (which names the passthrough
# mechanism, not a size/capability floor). CARLA 0.9.15 alone wants ~6-8 GB VRAM before
# Autoware shares the same card, and Tier 2's compute capability floor (vxedge-core's
# TIER2_MIN_COMPUTE_CAP) is 7.0 — pre-Turing is excluded on architecture, not memory. Nothing
# checks this against a host (manifests have no `parts:` list); the block keeps the
# declaration honest and machine-readable.
requires:
  arch: x86_64
  gpu:
    vram_gb: 8
    compute_capability: "7.0"
upstream:
  ref: docker.io/carlasim/carla:0.9.15
  digest: sha256:1af47c314443f4a2d0869ac399c5b5eabde138a5bc39dd31dcbb1540e22f5588
annotations:
  headless: "true"
  license-note: "assets CC-BY-4.0 (attribution); engine under the Unreal Engine EULA; see README"
sbom:
  format: cyclonedx-json
  path: sbom.cdx.json
