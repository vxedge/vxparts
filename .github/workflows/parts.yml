name: parts

# Validation runs on every push/PR. Publishing is deliberately manual: pushing into the
# vxedge org namespace is an outward-facing act, and the repo's stance is that it stays a
# decision rather than a side effect of merging a README fix.
#
# Container parts build here rather than on a workstation because they are pin-and-relabel
# artifacts: no GPU and no local state are involved, and publishing one should not require
# holding ~11 GB of compressed base images (CARLA 8.9 GB, Autoware amd64 2.0 GB) locally.

on:
  push:
    branches: [main]
    paths: ['parts/**', 'schema/**', 'scripts/**', '.github/workflows/parts.yml']
  pull_request:
    paths: ['parts/**', 'schema/**', 'scripts/**', '.github/workflows/parts.yml']
  workflow_dispatch:
    inputs:
      part:
        description: 'Part directory to publish (e.g. parts/hpc/sim/app/carla-server)'
        required: true
        type: choice
        options:
          - parts/hpc/sim/app/carla-server
          - parts/hpc/ad/app/autoware
          - parts/hpc/ad/middleware/ros2-humble
          - parts/hpc/ad/middleware/carla-client
      tag:
        description: 'SemVer tag to publish'
        required: true
        default: '0.1.0'
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML
      # lint checks every part against the build contract its layer declares in
      # taxonomy.yaml; scan is the VXPN collision gate. Both are cheap and catch the
      # failures that are expensive to find after publishing.
      - name: Lint parts
        run: ./scripts/vxpn.py lint
      - name: VXPN collision scan
        run: ./scripts/vxpn.py scan

  # Builds every changed container part (VXPARTS_NO_PUSH=1: no registry credentials needed,
  # no push happens) on every push/PR — catches a broken Containerfile or a label that
  # doesn't survive the build before merge, which `validate`'s lint/scan never can since they
  # only check part.yaml/taxonomy metadata, never invoke podman. `publish` below stays the
  # only path that actually pushes, and stays manual (see the file's own top comment on why).
  build-containers:
    name: build changed container parts
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML
      # Same reclaim as `publish` below — CARLA's base alone (8.9 GB) exceeds a stock
      # runner's ~14 GB free on /.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - name: Determine changed container parts
        id: changed
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            # First push to a new branch: `before` is all-zeros. Diff against the empty tree
            # so every part present today is treated as "changed" rather than the step
            # erroring on a ref that doesn't exist.
            if [[ "$BASE" =~ ^0+$ ]]; then
              BASE="$(git hash-object -t tree /dev/null)"
            fi
          fi
          mapfile -t parts < <(
            git diff --name-only "$BASE" HEAD -- parts/ \
              | awk -F/ 'NF>=6 {print $1"/"$2"/"$3"/"$4"/"$5}' \
              | sort -u
          )
          {
            echo "parts<<VXEOF"
            printf '%s\n' "${parts[@]}"
            echo "VXEOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build changed container parts (no push)
        env:
          VXPARTS_NO_PUSH: "1"
        run: |
          set -euo pipefail
          any=0
          while IFS= read -r part; do
            [[ -z "$part" ]] && continue
            if [[ -f "$part/Containerfile" ]]; then
              any=1
              ./scripts/publish/publish-container.sh "$part" ci-build
            fi
          done <<<"${{ steps.changed.outputs.parts }}"
          if [[ "$any" == "0" ]]; then
            echo "no container parts changed — nothing to build"
          fi

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML

      # A stock runner has ~14 GB free on /; CARLA's base alone unpacks past that. Dropping
      # the preinstalled toolchains we do not use reclaims roughly 30 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Log in to GHCR
        # NOTE: GITHUB_TOKEN can only write a package the repository is allowed to write.
        # A package first published from a workstation is owned by that user until its
        # settings grant this repo access — if this step's push 403s, that is why, and the
        # fix is in the package's settings, not here.
        run: echo "${{ secrets.GITHUB_TOKEN }}" \
             | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish ${{ inputs.part }}
        run: ./scripts/publish/publish-container.sh "${{ inputs.part }}" "${{ inputs.tag }}"

      - name: Report
        run: ./scripts/vxpn.py meta "${{ inputs.part }}"
